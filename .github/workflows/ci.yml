name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test storage, authentication, MCP and installer
        run: python3 -m unittest discover -s tests -v

  ios:
    name: Swift transport and iOS build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Exercise the native TLS client against the local service
        run: python3 -m tests.test_swift_transport
      - name: Typecheck shared native components
        run: >-
          xcrun swiftc -typecheck
          ios/WatchBridge/Models.swift
          ios/WatchBridge/Keychain.swift
          ios/WatchBridge/BridgeClient.swift
          ios/WatchBridge/HealthReader.swift
      - name: Build the full iPhone app for Simulator
        run: >-
          xcodebuild
          -project ios/WatchBridge.xcodeproj
          -scheme WatchBridge
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
